kind = "mobile"
previewPath = "/event-shooter-mobile/"
title = "EventShooter Mobile"
description = "A mobile companion for EventShooter customers to discover photographers, explore portfolios, book event coverage, and manage bookings on the go."
version = "1.0.0"
id = "artifacts/event-shooter-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/event-shooter-mobile/" ]
localPort = 20776

[services.development]
run = "pnpm --filter @workspace/event-shooter-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/event-shooter-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/event-shooter-mobile", "run", "serve" ]

[services.env]
PORT = "20776"
BASE_PATH = "/event-shooter-mobile/"
