kind = "web"
previewPath = "/"
title = "EventShooter"
version = "1.0.0"
id = "artifacts/event-shooter"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24560

[services.development]
run = "pnpm --filter @workspace/event-shooter run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/event-shooter", "run", "build" ]
publicDir = "artifacts/event-shooter/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24560"
BASE_PATH = "/"
