<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Booker Pro</title><style>body{margin:0;font-family:Inter,system-ui;background:#0b1020;color:#fff}header{padding:28px 7%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #202944}.brand{font-size:24px;font-weight:800}.hero{padding:70px 7%;background:radial-gradient(circle at 70% 20%,#4734a555,transparent 40%)}h1{font-size:clamp(40px,6vw,72px);max-width:850px;margin:10px 0}p{color:#b7c0d8;line-height:1.6}.btn{background:#fff;color:#0b1020;border:0;padding:12px 18px;border-radius:12px;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;padding:35px 7%}.card{background:#141b31;border:1px solid #27304a;border-radius:18px;padding:22px;cursor:pointer}.card:hover{transform:translateY(-3px);border-color:#7180ff}.muted{color:#91a0bf}.section{padding:20px 7%}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center}.box{background:#121a30;padding:28px;border-radius:20px;width:min(420px,88%)}input{width:100%;box-sizing:border-box;margin:7px 0;padding:12px;border-radius:10px;border:1px solid #34405e;background:#0d1427;color:white}.row{display:flex;gap:10px;flex-wrap:wrap}</style></head><body><header><div class="brand">✨ Event Booker Pro</div><button class="btn" onclick="openAuth()">Login / Signup</button></header><section class="hero"><div class="muted">EVENT SERVICES • Bhopal & beyond</div><h1>Book the people who make your event unforgettable.</h1><p>Photographers, makeup artists, planners, caterers, DJs and decorators — all in one place.</p></section><section class="section"><h2>Explore services</h2></section><div id="grid" class="grid"></div><div id="modal" class="modal"><div class="box"><h2 id="title">Login</h2><input id="name" placeholder="Name"><input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><div class="row"><button class="btn" onclick="submitAuth()">Continue</button><button class="btn" onclick="closeAuth()">Close</button></div><p id="msg"></p></div></div><script>
const cats=[["💄","Makeup Artist"],["📸","Photographer"],["💍","Wedding Planner"],["🍽","Catering"],["🎧","DJ"],["🎀","Decoration"],["🎂","Birthday Planner"],["🏛","Event Organizer"]];
const grid=document.getElementById("grid"); cats.forEach(c=>{let d=document.createElement("div");d.className="card";d.innerHTML="<div style='font-size:32px'>"+c[0]+"</div><h3>"+c[1]+"</h3><p>View available professionals and book for your date.</p><button class='btn' onclick='loadProviders("+JSON.stringify(c[1])+")'>Explore</button>";grid.appendChild(d)});
async function loadProviders(category){const r=await fetch("/api/providers?category="+encodeURIComponent(category));const data=await r.json();alert(data.length?data.map(x=>x.name+" • ₹"+x.price).join("\n"):"No providers yet. Admin/provider onboarding can add them.");}
function openAuth(){modal.style.display="grid"} function closeAuth(){modal.style.display="none"} async function submitAuth(){const name=document.getElementById("name").value,email=document.getElementById("email").value,password=document.getElementById("password").value;const r=await fetch("/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,email,password})});const d=await r.json();document.getElementById("msg").textContent=d.message||"Registered";if(r.ok){localStorage.setItem("eventBookerToken",d.token);setTimeout(closeAuth,700)}}</script></body></html>
