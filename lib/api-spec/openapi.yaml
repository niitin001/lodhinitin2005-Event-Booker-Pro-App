components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }

    # ─── AUTH SCHEMAS ───
    RegisterInput:
      type: object
      required: [name, email, password, role]
      properties:
        name: { type: string }
        email: { type: string }
        password: { type: string }
        phone: { type: string }
        role: { type: string, enum: [customer, photographer] }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    GoogleLoginInput:
      type: object
      required: [token]
      properties:
        token: { type: string }

    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email: { type: string }

    VerifyOtpInput:
      type: object
      required: [email, otp]
      properties:
        email: { type: string }
        otp: { type: string }

    ResetPasswordInput:
      type: object
      required: [email, otp, newPassword]
      properties:
        email: { type: string }
        otp: { type: string }
        newPassword: { type: string }

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user:
          $ref: "#/components/schemas/User"

    # ─── USER SCHEMAS ───
    User:
      type: object
      required: [id, name, email, role, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        role: { type: string, enum: [customer, photographer, admin] }
        isVerified: { type: boolean }
        isBanned: { type: boolean }
        city: { type: ["string", "null"] }
        referralCode: { type: ["string", "null"] }
        createdAt: { type: string }

    UserUpdate:
      type: object
      properties:
        name: { type: string }
        phone: { type: string }
        avatarUrl: { type: string }
        city: { type: string }

    WishlistInput:
      type: object
      required: [photographerId]
      properties:
        photographerId: { type: integer }

    Notification:
      type: object
      required: [id, title, message, isRead, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        message: { type: string }
        type: { type: string }
        isRead: { type: boolean }
        createdAt: { type: string }

    # ─── PHOTOGRAPHER SCHEMAS ───
    Photographer:
      type: object
      required: [id, userId, displayName, city, rating, totalReviews, startingPrice, isAvailable, isFeatured]
      properties:
        id: { type: integer }
        userId: { type: integer }
        displayName: { type: string }
        bio: { type: ["string", "null"] }
        city: { type: string }
        specializations: { type: array, items: { type: string } }
        rating: { type: number }
        totalReviews: { type: integer }
        totalBookings: { type: integer }
        startingPrice: { type: number }
        coverImageUrl: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        isAvailable: { type: boolean }
        isFeatured: { type: boolean }
        isVerified: { type: boolean }
        isApproved: { type: boolean }
        yearsOfExperience: { type: ["integer", "null"] }
        instagramHandle: { type: ["string", "null"] }
        whatsappNumber: { type: ["string", "null"] }

    PhotographerProfile:
      type: object
      required: [id, userId, displayName, city, rating, totalReviews, startingPrice, isAvailable, isFeatured]
      properties:
        id: { type: integer }
        userId: { type: integer }
        displayName: { type: string }
        bio: { type: ["string", "null"] }
        city: { type: string }
        specializations: { type: array, items: { type: string } }
        rating: { type: number }
        totalReviews: { type: integer }
        totalBookings: { type: integer }
        startingPrice: { type: number }
        coverImageUrl: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        isAvailable: { type: boolean }
        isFeatured: { type: boolean }
        isVerified: { type: boolean }
        isApproved: { type: boolean }
        yearsOfExperience: { type: ["integer", "null"] }
        portfolio: { type: array, items: { $ref: "#/components/schemas/PortfolioItem" } }
        packages: { type: array, items: { $ref: "#/components/schemas/Package" } }
        reviews: { type: array, items: { $ref: "#/components/schemas/Review" } }
        equipment: { type: ["string", "null"] }
        instagramHandle: { type: ["string", "null"] }
        whatsappNumber: { type: ["string", "null"] }

    PhotographerListResponse:
      type: object
      required: [photographers, total, page, limit]
      properties:
        photographers:
          type: array
          items:
            $ref: "#/components/schemas/Photographer"
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }

    PhotographerUpdate:
      type: object
      properties:
        displayName: { type: string }
        bio: { type: string }
        city: { type: string }
        specializations: { type: array, items: { type: string } }
        startingPrice: { type: number }
        coverImageUrl: { type: string }
        avatarUrl: { type: string }
        isAvailable: { type: boolean }
        yearsOfExperience: { type: integer }
        equipment: { type: string }
        instagramHandle: { type: string }

    PortfolioItem:
      type: object
      required: [id, photographerId, mediaUrl, mediaType, createdAt]
      properties:
        id: { type: integer }
        photographerId: { type: integer }
        mediaUrl: { type: string }
        mediaType: { type: string, enum: [photo, video, reel] }
        title: { type: ["string", "null"] }
        eventType: { type: ["string", "null"] }
        isApproved: { type: boolean }
        createdAt: { type: string }

    PortfolioItemInput:
      type: object
      required: [mediaUrl, mediaType]
      properties:
        mediaUrl: { type: string }
        mediaType: { type: string, enum: [photo, video, reel] }
        title: { type: string }
        eventType: { type: string }

    AvailabilitySlot:
      type: object
      required: [id, photographerId, date, isAvailable]
      properties:
        id: { type: integer }
        photographerId: { type: integer }
        date: { type: string }
        isAvailable: { type: boolean }
        timeSlots: { type: array, items: { type: string } }

    AvailabilityInput:
      type: object
      required: [dates]
      properties:
        dates: { type: array, items: { type: string } }
        isAvailable: { type: boolean }

    Package:
      type: object
      required: [id, photographerId, name, price, duration]
      properties:
        id: { type: integer }
        photographerId: { type: integer }
        name: { type: string }
        description: { type: ["string", "null"] }
        price: { type: number }
        duration: { type: integer }
        includes: { type: array, items: { type: string } }
        addons: { type: array, items: { $ref: "#/components/schemas/PackageAddon" } }
        eventTypes: { type: array, items: { type: string } }
        isActive: { type: boolean }

    PackageAddon:
      type: object
      required: [id, name, price]
      properties:
        id: { type: integer }
        name: { type: string }
        price: { type: number }
        description: { type: ["string", "null"] }

    PackageInput:
      type: object
      required: [name, price, duration]
      properties:
        name: { type: string }
        description: { type: string }
        price: { type: number }
        duration: { type: integer }
        includes: { type: array, items: { type: string } }
        eventTypes: { type: array, items: { type: string } }

    EarningsSummary:
      type: object
      required: [totalEarned, pendingAmount, thisMonth, lastMonth]
      properties:
        totalEarned: { type: number }
        pendingAmount: { type: number }
        thisMonth: { type: number }
        lastMonth: { type: number }
        monthlyData: { type: array, items: { $ref: "#/components/schemas/MonthlyEarning" } }

    MonthlyEarning:
      type: object
      required: [month, amount, bookings]
      properties:
        month: { type: string }
        amount: { type: number }
        bookings: { type: integer }

    PhotographerDashboard:
      type: object
      required: [totalBookings, pendingBookings, completedBookings, totalEarnings, rating, totalReviews]
      properties:
        totalBookings: { type: integer }
        pendingBookings: { type: integer }
        confirmedBookings: { type: integer }
        completedBookings: { type: integer }
        totalEarnings: { type: number }
        thisMonthEarnings: { type: number }
        rating: { type: number }
        totalReviews: { type: integer }
        recentBookings: { type: array, items: { $ref: "#/components/schemas/Booking" } }

    PlatformStats:
      type: object
      required: [totalPhotographers, totalBookings, happyClients, citiesCovered]
      properties:
        totalPhotographers: { type: integer }
        totalBookings: { type: integer }
        happyClients: { type: integer }
        citiesCovered: { type: integer }
        averageRating: { type: number }

    # ─── BOOKING SCHEMAS ───
    Booking:
      type: object
      required: [id, customerId, photographerId, eventType, eventDate, city, totalAmount, advanceAmount, status, createdAt]
      properties:
        id: { type: integer }
        customerId: { type: integer }
        photographerId: { type: integer }
        packageId: { type: ["integer", "null"] }
        eventType: { type: string }
        eventDate: { type: string }
        eventEndDate: { type: ["string", "null"] }
        city: { type: string }
        venue: { type: ["string", "null"] }
        totalAmount: { type: number }
        advanceAmount: { type: number }
        remainingAmount: { type: number }
        status: { type: string, enum: [pending, confirmed, rejected, completed, cancelled, in_progress] }
        notes: { type: ["string", "null"] }
        referenceImages: { type: array, items: { type: string } }
        selectedAddons: { type: array, items: { type: string } }
        rejectionReason: { type: ["string", "null"] }
        cancellationReason: { type: ["string", "null"] }
        photographer: { $ref: "#/components/schemas/Photographer" }
        customer: { $ref: "#/components/schemas/User" }
        package: { $ref: "#/components/schemas/Package" }
        createdAt: { type: string }
        updatedAt: { type: string }

    BookingInput:
      type: object
      required: [photographerId, eventType, eventDate, city, packageId]
      properties:
        photographerId: { type: integer }
        packageId: { type: integer }
        eventType: { type: string }
        eventDate: { type: string }
        eventEndDate: { type: string }
        city: { type: string }
        venue: { type: string }
        notes: { type: string }
        referenceImages: { type: array, items: { type: string } }
        selectedAddons: { type: array, items: { type: string } }
        couponCode: { type: string }

    BookingUpdate:
      type: object
      properties:
        eventDate: { type: string }
        city: { type: string }
        venue: { type: string }
        notes: { type: string }

    RejectInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string }

    CancelInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string }

    Deliverable:
      type: object
      required: [id, bookingId, mediaUrl, mediaType, uploadedAt]
      properties:
        id: { type: integer }
        bookingId: { type: integer }
        mediaUrl: { type: string }
        mediaType: { type: string, enum: [photo, video] }
        caption: { type: ["string", "null"] }
        uploadedAt: { type: string }

    DeliverableInput:
      type: object
      required: [mediaUrl, mediaType]
      properties:
        mediaUrl: { type: string }
        mediaType: { type: string, enum: [photo, video] }
        caption: { type: string }

    PriceEstimateInput:
      type: object
      required: [packageId, eventType, durationHours]
      properties:
        packageId: { type: integer }
        eventType: { type: string }
        durationHours: { type: number }
        selectedAddons: { type: array, items: { type: string } }
        couponCode: { type: string }

    PriceEstimate:
      type: object
      required: [basePrice, addonsCost, discountAmount, totalAmount, advanceAmount, remainingAmount]
      properties:
        basePrice: { type: number }
        addonsCost: { type: number }
        discountAmount: { type: number }
        couponDiscount: { type: number }
        totalAmount: { type: number }
        advanceAmount: { type: number }
        remainingAmount: { type: number }
        breakdown: { type: array, items: { $ref: "#/components/schemas/PriceBreakdownItem" } }

    PriceBreakdownItem:
      type: object
      required: [label, amount]
      properties:
        label: { type: string }
        amount: { type: number }

    # ─── PAYMENT SCHEMAS ───
    Payment:
      type: object
      required: [id, bookingId, amount, type, status, createdAt]
      properties:
        id: { type: integer }
        bookingId: { type: integer }
        amount: { type: number }
        type: { type: string, enum: [advance, remaining, full, refund] }
        status: { type: string, enum: [pending, completed, failed, refunded] }
        method: { type: ["string", "null"] }
        razorpayOrderId: { type: ["string", "null"] }
        razorpayPaymentId: { type: ["string", "null"] }
        createdAt: { type: string }

    PaymentInitInput:
      type: object
      required: [bookingId, amount, type]
      properties:
        bookingId: { type: integer }
        amount: { type: number }
        type: { type: string, enum: [advance, remaining, full] }
        method: { type: string, enum: [razorpay, upi] }

    PaymentInitResponse:
      type: object
      required: [orderId, amount, currency]
      properties:
        orderId: { type: string }
        amount: { type: number }
        currency: { type: string }
        keyId: { type: string }

    PaymentVerifyInput:
      type: object
      required: [bookingId, razorpayOrderId, razorpayPaymentId, razorpaySignature]
      properties:
        bookingId: { type: integer }
        razorpayOrderId: { type: string }
        razorpayPaymentId: { type: string }
        razorpaySignature: { type: string }

    Invoice:
      type: object
      required: [id, bookingId, paymentId, invoiceNumber, amount, issuedAt]
      properties:
        id: { type: integer }
        bookingId: { type: integer }
        paymentId: { type: integer }
        invoiceNumber: { type: string }
        amount: { type: number }
        taxAmount: { type: number }
        customerName: { type: string }
        photographerName: { type: string }
        eventType: { type: string }
        eventDate: { type: string }
        issuedAt: { type: string }

    RefundInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
        amount: { type: number }

    # ─── REVIEW SCHEMAS ───
    Review:
      type: object
      required: [id, customerId, photographerId, bookingId, rating, createdAt]
      properties:
        id: { type: integer }
        customerId: { type: integer }
        photographerId: { type: integer }
        bookingId: { type: integer }
        rating: { type: number }
        comment: { type: ["string", "null"] }
        isApproved: { type: boolean }
        customer: { $ref: "#/components/schemas/User" }
        createdAt: { type: string }

    ReviewInput:
      type: object
      required: [photographerId, bookingId, rating]
      properties:
        photographerId: { type: integer }
        bookingId: { type: integer }
        rating: { type: number }
        comment: { type: string }

    ReviewUpdate:
      type: object
      properties:
        rating: { type: number }
        comment: { type: string }

    # ─── CHAT SCHEMAS ───
    Conversation:
      type: object
      required: [id, bookingId, createdAt]
      properties:
        id: { type: integer }
        bookingId: { type: integer }
        lastMessage: { type: ["string", "null"] }
        lastMessageAt: { type: ["string", "null"] }
        unreadCount: { type: integer }
        otherParticipant: { $ref: "#/components/schemas/User" }
        createdAt: { type: string }

    ConversationInput:
      type: object
      required: [bookingId, participantId]
      properties:
        bookingId: { type: integer }
        participantId: { type: integer }

    Message:
      type: object
      required: [id, conversationId, senderId, content, type, createdAt]
      properties:
        id: { type: integer }
        conversationId: { type: integer }
        senderId: { type: integer }
        content: { type: string }
        type: { type: string, enum: [text, image, voice, file] }
        isRead: { type: boolean }
        sender: { $ref: "#/components/schemas/User" }
        createdAt: { type: string }

    MessageInput:
      type: object
      required: [content, type]
      properties:
        content: { type: string }
        type: { type: string, enum: [text, image, voice, file] }

    # ─── COUPON SCHEMAS ───
    Coupon:
      type: object
      required: [id, code, discountType, discountValue, isActive, createdAt]
      properties:
        id: { type: integer }
        code: { type: string }
        discountType: { type: string, enum: [percentage, flat] }
        discountValue: { type: number }
        minOrderAmount: { type: ["number", "null"] }
        maxDiscountAmount: { type: ["number", "null"] }
        usageLimit: { type: ["integer", "null"] }
        usedCount: { type: integer }
        expiresAt: { type: ["string", "null"] }
        isActive: { type: boolean }
        createdAt: { type: string }

    CouponInput:
      type: object
      required: [code, discountType, discountValue]
      properties:
        code: { type: string }
        discountType: { type: string, enum: [percentage, flat] }
        discountValue: { type: number }
        minOrderAmount: { type: number }
        maxDiscountAmount: { type: number }
        usageLimit: { type: integer }
        expiresAt: { type: string }

    CouponValidateInput:
      type: object
      required: [code, orderAmount]
      properties:
        code: { type: string }
        orderAmount: { type: number }

    CouponValidateResponse:
      type: object
      required: [isValid, discountAmount, finalAmount]
      properties:
        isValid: { type: boolean }
        discountAmount: { type: number }
        finalAmount: { type: number }
        coupon: { $ref: "#/components/schemas/Coupon" }

    # ─── ADMIN SCHEMAS ───
    AdminDashboard:
      type: object
      required: [totalUsers, totalPhotographers, totalBookings, totalRevenue, pendingApprovals]
      properties:
        totalUsers: { type: integer }
        totalPhotographers: { type: integer }
        totalBookings: { type: integer }
        totalRevenue: { type: number }
        pendingApprovals: { type: integer }
        thisMonthRevenue: { type: number }
        thisMonthBookings: { type: integer }
        activeUsers: { type: integer }
        recentBookings: { type: array, items: { $ref: "#/components/schemas/Booking" } }
        topPhotographers: { type: array, items: { $ref: "#/components/schemas/Photographer" } }
        revenueByMonth: { type: array, items: { $ref: "#/components/schemas/MonthlyEarning" } }

    BanInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string }

    FeatureInput:
      type: object
      required: [isFeatured]
      properties:
        isFeatured: { type: boolean }

    ModerateInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [approve, remove] }

    RevenueStats:
      type: object
      required: [totalRevenue, platformFee, netRevenue]
      properties:
        totalRevenue: { type: number }
        platformFee: { type: number }
        netRevenue: { type: number }
        byEventType: { type: array, items: { $ref: "#/components/schemas/RevenueByCategory" } }
        byCity: { type: array, items: { $ref: "#/components/schemas/RevenueByCategory" } }
        monthly: { type: array, items: { $ref: "#/components/schemas/MonthlyEarning" } }

    RevenueByCategory:
      type: object
      required: [category, amount, bookings]
      properties:
        category: { type: string }
        amount: { type: number }
        bookings: { type: integer }

    # ─── AI SCHEMAS ───
    AiEstimateInput:
      type: object
      required: [eventType, city, guestCount, durationHours]
      properties:
